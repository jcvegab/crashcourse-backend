[project]
name = "crashcourse-backend"
version = "0.1.0"
description = "Crashcourse Backend | Django 6.1 API for a course platform with GraphQL, Django Ninja REST, PostgreSQL, Docker and Render deployment."
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Joseph Vega", email = "admin@jcvegab.dev"},
]
keywords = [
    "api",
    "course-platform",
    "django",
    "django-ninja",
    "docker",
    "strawberry-django",
    "graphql",
    "postgresql",
    "python",
    "render",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "django==6.1",
    "strawberry-graphql==0.324.0",
    "strawberry-graphql-django==0.87.1",
    "django-cors-headers>=4.6.0",
    "django-environ==0.14.0",
    "whitenoise[brotli]>=6.8.2",
    "gunicorn==26.1.0",
    "psycopg>=3.2.4",
    "django-ninja==1.6.3",
]

[project.urls]
Repository = "https://github.com/jcvegab/crashcourse-backend"

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff==0.16.6",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "core"]
